</script>
<style>
:root{
  --navy:#2C357D; --navy-2:#232B6A; --sky:#5BC5F2; --pink:#E5007E;
  --bg:#F1F3FA; --surface:#FFFFFF; --surface-2:#F6F7FC; --ink:#1B2150; --ink-2:#5D6390; --line:#DDE1F0;
  --accent:#2C357D; --accent-soft:#E4E7F7;
  --late:#D0263A; --late-soft:#FCE6E9;
  --todo:#6B7096; --todo-soft:#ECEDF5;
  --doing:#0E7FB3; --doing-soft:#DDF2FC;
  --done:#1D7D52; --done-soft:#DDF2E6;
  --cancel:#8A6A7A; --cancel-soft:#F2E9EE;
  --shadow:0 1px 2px rgba(27,33,80,.06),0 4px 14px rgba(27,33,80,.05);
  --ch-todo:#A9AEDA; --ch-doing:#5BC5F2; --ch-done:#2C357D; --ch-cancel:#F7A8D0; --ch-late:#E5007E; --ch-bar:#2C357D;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ch-todo:#6E76B8; --ch-doing:#5BC5F2; --ch-done:#8E97F0; --ch-cancel:#F7A8D0; --ch-late:#FF3D9E; --ch-bar:#8E97F0;
    --bg:#12163A; --surface:#1B2052; --surface-2:#22285E; --ink:#ECEEFA; --ink-2:#A3A9D3; --line:#323A78;
    --accent:#5BC5F2; --accent-soft:#263172;
    --late:#FF8796; --late-soft:#45203A; --todo:#AEB3D6; --todo-soft:#2A3068;
    --doing:#5BC5F2; --doing-soft:#1C3A63; --done:#6BD69E; --done-soft:#1B3B45;
    --cancel:#D3A8BD; --cancel-soft:#3A2550; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
    --ch-todo:#6E76B8; --ch-doing:#5BC5F2; --ch-done:#8E97F0; --ch-cancel:#F7A8D0; --ch-late:#FF3D9E; --ch-bar:#8E97F0;
  --bg:#12163A; --surface:#1B2052; --surface-2:#22285E; --ink:#ECEEFA; --ink-2:#A3A9D3; --line:#323A78;
  --accent:#5BC5F2; --accent-soft:#263172;
  --late:#FF8796; --late-soft:#45203A; --todo:#AEB3D6; --todo-soft:#2A3068;
  --doing:#5BC5F2; --doing-soft:#1C3A63; --done:#6BD69E; --done-soft:#1B3B45;
  --cancel:#D3A8BD; --cancel-soft:#3A2550; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{margin:0;line-height:1.2;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* brand band */
.band{background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-90px;top:-110px;width:300px;height:300px;border-radius:50%;border:34px solid var(--sky);opacity:.14;pointer-events:none}
.band-in{max-width:1180px;margin:0 auto;padding:22px 20px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:20px;min-width:0}
.brand img{height:44px;width:auto;display:block}
.brand .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.25)}
.brand h1{font-size:clamp(20px,3vw,26px);font-weight:800;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--sky);font-weight:600;font-size:13.5px;letter-spacing:.01em}
.band .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.save-state{font-size:12.5px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:6px;margin-right:4px}
.save-state::before{content:"";width:7px;height:7px;border-radius:50%;background:#6BD69E}
.save-state.local::before{background:#F2B45A}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
.btn:hover{background:var(--surface-2)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.pink:hover{filter:brightness(1.08)}
.btn.danger{color:var(--late);border-color:transparent;background:transparent}
.btn.small{padding:6px 10px;font-size:12.5px}

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 80px}

/* summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.summary p{margin:0;font-size:16px;max-width:80ch}
.summary b{font-size:21px;font-weight:800}
.n-late{color:var(--late)}.n-open{color:var(--doing)}.n-done{color:var(--done)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:14px;background:var(--surface-2)}
.bar span{display:block;height:100%}

/* filters */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;align-items:end;margin-bottom:6px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 10px;width:100%;min-width:0;font-size:13.5px;color:var(--ink)}
.filters .search{grid-column:span 2}
.filters .end{display:flex;gap:8px;justify-content:flex-end;align-items:center;grid-column:-2/-1}
.viewbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.viewbar .hint{color:var(--ink-2);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* groups */
.group{margin-top:20px}
.group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.group-head h2{font-size:16.5px}
.group-head .count{color:var(--ink-2);font-size:13px;font-weight:600}
.group.late h2{color:var(--late)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:180px minmax(0,1fr) 80px 120px 150px 36px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row.is-closed .task{color:var(--ink-2)}
.row.is-cancel .task{text-decoration:line-through}
.client{font-weight:600;display:flex;align-items:center;gap:10px;min-width:0;font-size:13.5px}
.client span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{flex:none;width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-size:11px;font-weight:800;color:#fff}
.logo img{width:100%;height:100%;object-fit:contain;padding:2px}
.logo.mono{border:0}
.task{min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left;font-weight:600}
.task:hover{color:var(--pink)}
.task small{display:block;color:var(--ink-2);font-size:12.5px;font-weight:500}
.prio{font-size:12.5px;color:var(--ink-2);font-weight:600}
.prio.Alta{color:var(--pink)}
.due{font-size:13px;font-variant-numeric:tabular-nums;font-weight:500}
.due.late{color:var(--late);font-weight:700}
.due.today{color:var(--doing);font-weight:700}
.status{appearance:none;-webkit-appearance:none;border:0;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;width:100%}
.s-todo{background:var(--todo-soft);color:var(--todo)}
.s-doing{background:var(--doing-soft);color:var(--doing)}
.s-done{background:var(--done-soft);color:var(--done)}
.s-cancel{background:var(--cancel-soft);color:var(--cancel)}
.icon-btn{border:0;background:transparent;border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--ink-2);font-size:17px}
.icon-btn:hover{background:var(--line);color:var(--ink)}
details.group>summary{list-style:none;cursor:pointer}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary h2::after{content:" ▸";color:var(--ink-2);font-size:13px}
details.group[open]>summary h2::after{content:" ▾"}
.meta-m{display:none}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:10px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:200px}
.col.drop{outline:2px dashed var(--pink);outline-offset:-4px}
.col h2{font-size:14.5px;margin:4px 4px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.col h2 .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.col h2 span.n{color:var(--ink-2);font-weight:600;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow)}
.card .c-top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.card .c-top .logo{width:24px;height:24px;border-radius:6px;font-size:9.5px}
.card .c-top .due{margin-left:auto}
.card .c-title{font-weight:700;margin:7px 0 4px;overflow-wrap:anywhere;font-size:13.5px}
.card .c-meta{font-size:12px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}

.empty{text-align:center;padding:44px 20px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:14px;margin-top:16px}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}

/* dialogs */
dialog{border:0;border-radius:18px;padding:0;width:min(580px,calc(100% - 24px));max-height:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(18,22,58,.55)}
.dlg{padding:22px}
.dlg-head{display:flex;align-items:center;gap:10px;margin:-22px -22px 18px;padding:16px 22px;background:var(--navy);color:#fff;border-radius:18px 18px 0 0}
.dlg-head h2{font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
.dlg label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.dlg label input,.dlg label select,.dlg label textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;font-weight:500;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:70px}
.dlg-foot{display:flex;justify-content:space-between;gap:8px;margin-top:20px;flex-wrap:wrap}
.dlg-foot .actions{display:flex;gap:8px}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.navy{background:var(--pink);border-color:var(--pink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.navy{background:var(--pink);border-color:var(--pink)}}

/* manage */
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px}
.tabs button[aria-selected="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.mlist{border:1px solid var(--line);border-radius:12px;max-height:46vh;overflow:auto}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .name{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.madd{display:flex;gap:8px;margin-top:12px}
.madd input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px}
.note{font-size:12.5px;color:var(--ink-2);margin:10px 0 0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.show{opacity:1}

.btn.icon{padding:7px 11px;font-size:18px;line-height:1}
.viewtools{display:flex;gap:8px;align-items:center}
.menu-wrap{position:relative}
.menu-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:36px;cursor:pointer;font-size:18px;font-weight:700;line-height:1;color:var(--ink)}
.menu-btn:hover{background:var(--surface-2)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;min-width:180px;z-index:20}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px}
.menu button:hover{background:var(--surface-2)}
.tabs{flex-wrap:wrap}
.locked{font-size:11.5px;color:var(--ink-2);font-weight:600;padding:0 8px}
/* painel gerencial */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-top:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-size:15px;margin-bottom:2px}
.panel .sub{color:var(--ink-2);font-size:12.5px;margin:0 0 12px}
.p-geral{grid-column:span 4}.p-status{grid-column:span 4}.p-resp{grid-column:span 4}.p-cliente{grid-column:span 7}.p-semana{grid-column:span 5}
.chart-box{position:relative;height:240px}
.p-cliente .chart-box{height:auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:10px}
.kpi{background:var(--navy);color:#fff;border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.kpi:nth-child(2){background:var(--sky);color:var(--navy)}
.kpi:nth-child(3){background:var(--pink)}
.kpi:nth-child(4){background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.kpi b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.kpi span{font-size:12.5px;font-weight:600;opacity:.9}
.readonly-note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
.pill{display:inline-block;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;text-align:center;width:100%}
@media (max-width:980px){.p-geral,.p-status,.p-resp{grid-column:span 6}.p-cliente,.p-semana{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.p-geral,.p-status,.p-resp{grid-column:1/-1}}
@media (max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .row{grid-template-columns:minmax(0,1fr) 130px;grid-template-areas:"client status" "task task" "meta del";row-gap:6px}
  .row .client{grid-area:client}.row .task{grid-area:task}.row .st{grid-area:status}
  .row .prio,.row .due-c{display:none}.row .meta-m{display:flex;grid-area:meta;gap:12px;font-size:12.5px;color:var(--ink-2)}
  .row .icon-btn{grid-area:del;justify-self:end}
  .filters .search{grid-column:1/-1}.filters .end{grid-column:1/-1}
  .brand .sep{display:none}.brand{gap:14px}.brand img{height:34px}
}
@media (max-width:560px){.grid{grid-template-columns:1fr}.board{grid-template-columns:1fr}.brand{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
const DEF_STATUS=["Não iniciado","Em andamento","Finalizado","Cancelado"];
const LOCKED_STATUS=["Finalizado","Cancelado"];
const DEF_TYPES=["Chamado","Melhorias","Estudos","Validações/Homologações","Apresentação"];
const DEF_PRIOS=["Alta","Média","Baixa"];
const SCLASS={"Não iniciado":"s-todo","Em andamento":"s-doing","Finalizado":"s-done","Cancelado":"s-cancel"};
const SDOT={"Não iniciado":"var(--todo)","Em andamento":"var(--doing)","Finalizado":"var(--done)","Cancelado":"var(--cancel)"};
const EXTRA_COLORS=["#E5007E","#0E7FB3","#7A82C9","#3FA9D6","#B4006A","#4B55A8"];
const ST=()=>settings.status,TY=()=>settings.tipos,PRS=()=>settings.prioridades;
function extraColor(s){const i=ST().filter(x=>!SCLASS[x]).indexOf(s);return EXTRA_COLORS[(i<0?0:i)%EXTRA_COLORS.length]}
function stClass(s){return SCLASS[s]||"s-custom"}
function stStyle(s){if(SCLASS[s])return "";const c=extraColor(s);return `background:${c}22;color:${c}`}
function stDot(s){return SDOT[s]||extraColor(s)}

function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function fmtDate(iso){if(!iso)return "Sem data";const [y,m,d]=iso.split("-");return d+"/"+m+(y!==todayISO().slice(0,4)?"/"+y.slice(2):"")}
function dueLabel(t){
  if(!t.prazo) return "Sem data";
  if(isOpen(t)){const td=todayISO();
    if(t.prazo<td) return "Atrasada · "+fmtDate(t.prazo);
    if(t.prazo===td) return "Hoje";
    if(t.prazo===addDays(td,1)) return "Amanhã";}
  return fmtDate(t.prazo);
}
function dueClass(t){if(!isOpen(t)||!t.prazo)return "";const td=todayISO();return t.prazo<td?"late":t.prazo===td?"today":""}
function colorFor(name){let h=0;for(const ch of (name||""))h=(h*31+ch.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}

}

async function init(){
  render();
  if(!window.claude||typeof window.claude.use!=="function"){useLocal();return}
  let db=null,user=null,uid=null;
  try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);if(user)uid=await user.id()}catch(e){}
  if(!db||!uid){useLocal();return}
  const col=db.collection("tasks"),setRef=db.doc("config/settings");
  try{canEdit=!!(await user.isOwner())}catch(e){canEdit=false}
  applyRole();
  let first=true;
  setRef.onSnapshot(d=>{if(d.exists)settings=sanitizeSettings(d.data());render();if($("#mdlg").open)renderManage()},()=>{});
  col.onSnapshot(snap=>{
    tasks=snap.docs.filter(d=>d.exists).map(d=>({...d.data(),id:d.id}));
    if(first&&!snap.metadata.fromCache){first=false;setSaveState(canEdit?"Salvo na sua conta":"Modo leitura",!canEdit);if(canEdit)migrate()}
    render();if($("#mdlg").open)renderManage();
  },()=>setSaveState("Sem conexão — recarregue a página",true));
  const chain=new Map();
  const queue=(id,fn)=>{const p=(chain.get(id)||Promise.resolve()).then(fn);chain.set(id,p.catch(()=>{}));return p};
  const fail=e=>toast(e&&e.code==="quota_exceeded"?"Limite de armazenamento atingido":"Não foi possível salvar. Tente de novo.");
  store={
    async save(id,data){
      const i=tasks.findIndex(t=>t.id===id);const rec={...data,id};if(i>=0)tasks[i]=rec;else tasks.push(rec);render();
      const body={...data};delete body.id;
      try{await queue(id,()=>col.doc(id).set(body))}catch(e){fail(e)}
    },
    async remove(id){tasks=tasks.filter(t=>t.id!==id);render();try{await queue(id,()=>col.doc(id).delete())}catch(e){toast("Não foi possível excluir.")}},
    async saveSettings(){render();renderManage();try{await queue("_settings",()=>setRef.set(JSON.parse(JSON.stringify(settings))))}catch(e){fail(e)}}
  };
  if(!first)return;
  setTimeout(()=>{if(first){first=false;setSaveState(canEdit?"Salvo na sua conta":"Modo leitura",!canEdit);if(canEdit)migrate()}},4000);
}
function applyRole(){
  ["#newBtn","#manageBtn"].forEach(s=>$(s).hidden=!canEdit);
  $("#roNote").hidden=canEdit;

}
/* convert the old task types to the new list, once */
async function migrate(){
  for(const t of tasks.slice()){
    if(t.cliente==="Voicce"){await store.remove(t.id);continue}
    if(LEGACY_TYPES[t.tipo]||LEGACY_CLIENTS[t.cliente]){const d={...t,tipo:LEGACY_TYPES[t.tipo]||t.tipo,cliente:LEGACY_CLIENTS[t.cliente]||t.cliente};delete d.id;await store.save(t.id,d)}
  }
}

/* ---------- options ---------- */
function clientNames(){return settings.clientes.map(c=>c.nome)}
function legacyClients(){const known=new Set(clientNames());return [...new Set(tasks.map(t=>t.cliente).filter(c=>c&&!known.has(c)))].sort((a,b)=>a.localeCompare(b,"pt-BR"))}
function opts(list,cur){return list.map(v=>`<option ${v===cur?"selected":""}>${esc(v)}</option>`).join("")}
function fillFilter(sel,allLabel,list,extra){
  const cur=sel.value;
  sel.innerHTML=`<option value="">${allLabel}</option>`+opts(list)+(extra&&extra.length?`<optgroup label="Nomes antigos">${opts(extra)}</optgroup>`:"");
  if([...list,...(extra||[])].includes(cur))sel.value=cur;
}
function fillFilters(){
  fillFilter($("#fCliente"),"Todos",clientNames());
  fillFilter($("#fResp"),"Todos",settings.responsaveis);
  fillFilter($("#fTipo"),"Todos",TY());
  fillFilter($("#fStatus"),"Todos",ST());
  fillFilter($("#fPrio"),"Todas",PRS());
}

/* ---------- filtering ---------- */
function filtered(){
  const q=$("#q").value.trim().toLowerCase(),c=$("#fCliente").value,r=$("#fResp").value,ty=$("#fTipo").value,st=$("#fStatus").value,p=$("#fPrio").value,de=$("#fDe").value,ate=$("#fAte").value;
  return tasks.filter(t=>(!q||(t.tarefa+" "+t.cliente+" "+(t.notas||"")).toLowerCase().includes(q))
    &&(!c||t.cliente===c)&&(!r||t.responsavel===r)&&(!ty||t.tipo===ty)&&(!st||t.status===st)&&(!p||t.prioridade===p)
    &&(!de||(t.prazo&&t.prazo>=de))&&(!ate||(t.prazo&&t.prazo<=ate)));
}
function activeFilters(){return ["#q","#fCliente","#fResp","#fTipo","#fStatus","#fPrio","#fDe","#fAte"].filter(s=>$(s).value).length}

/* ---------- render ---------- */
const prIdx=p=>{const i=PRS().indexOf(p);return i<0?99:i};
const sortByDue=(a,b)=>(a.prazo||"9999").localeCompare(b.prazo||"9999")||prIdx(a.prioridade)-prIdx(b.prioridade);
const sortRecent=(a,b)=>(b.prazo||"").localeCompare(a.prazo||"");
function renderSummary(list){
  const td=todayISO(),total=list.length;
  const done=list.filter(t=>t.status==="Finalizado").length,cancel=list.filter(t=>t.status==="Cancelado").length;
  const doing=list.filter(t=>t.status==="Em andamento").length,todo=list.filter(t=>t.status==="Não iniciado").length;
  const open=doing+todo,late=list.filter(t=>isOpen(t)&&t.prazo&&t.prazo<td).length;
  if(!total){$("#summary").innerHTML=`<p>${tasks.length?"Nenhuma demanda nesses filtros.":"Nenhuma demanda ainda. Comece adicionando o que você precisa fazer."}</p>`;return}
  const pct=n=>(n/total*100).toFixed(2)+"%";
  $("#summary").innerHTML=`<p>${activeFilters()?"Nos filtros atuais, há":"Você tem"} <b class="n-open">${open}</b> ${open===1?"demanda aberta":"demandas abertas"}${late?`, <b class="n-late">${late}</b> ${late===1?"atrasada":"atrasadas"}`:""}. <b class="n-done">${done}</b> ${done===1?"finalizada":"finalizadas"}${cancel?` e ${cancel} ${cancel===1?"cancelada":"canceladas"}`:""}, de ${total} no total.</p>
  <div class="bar" title="${done} finalizadas, ${doing} em andamento, ${todo} não iniciadas, ${cancel} canceladas"><span style="width:${pct(done)};background:var(--ch-done)"></span><span style="width:${pct(doing)};background:var(--ch-doing)"></span><span style="width:${pct(todo)};background:var(--ch-todo)"></span><span style="width:${pct(cancel)};background:var(--ch-cancel)"></span></div>`;
}

function lum(c){const m=String(c).match(/^#?([0-9a-f]{6})$/i);if(!m)return 0;const n=parseInt(m[1],16);const ch=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*ch[0]+.7152*ch[1]+.0722*ch[2]}

document.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".col.drop").forEach(c=>c.classList.remove("drop"))});

const moreBtn=$("#moreBtn"),moreMenu=$("#moreMenu");
function setMenu(open){moreMenu.hidden=!open;moreBtn.setAttribute("aria-expanded",open)}
moreBtn.onclick=e=>{e.stopPropagation();setMenu(moreMenu.hidden)};
document.addEventListener("click",e=>{if(!moreMenu.hidden&&!e.target.closest(".menu-wrap"))setMenu(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!moreMenu.hidden){setMenu(false);moreBtn.focus()}});
$("#exportBtn").onclick=async()=>{setMenu(false);
  const cols=["cliente","tarefa","status","prazo","responsavel","prioridade","tipo","notas"];
  const head=["Cliente","Tarefa","Status","Data de entrega","Responsável","Prioridade","Tipo de Tarefa","Notas"];
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const csv="\ufeff"+[head.map(q).join(";"),...filtered().sort(sortByDue).map(t=>cols.map(c=>q(t[c])).join(";"))].join("\r\n");
  const filename="demandas-"+todayISO()+".csv";
  let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use("downloads")}catch(e){}
  if(dl){try{await dl.save({filename,data:csv})}catch(e){}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};

let chartFailed=false;
(function loadChart(){if(window.Chart)return;const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js";sc.async=true;
  sc.onload=()=>{if(view==="dash")render()};sc.onerror=()=>{chartFailed=true;if(view==="dash")render()};document.head.appendChild(sc)})();
init();
})();
</script>
</body>
</html>
